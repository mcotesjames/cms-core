# Checks every push and pull request: types, lint (including the platform/site boundary), tests
# and the production build of the fixture site. A push to main that passes is then deployed to
# staging (spec section 2 → Environments): migrations first, then the exact Worker that was built
# and checked. Production is never deployed from here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # re-run checks + staging deploy by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main never are (a deploy mid-migration).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npx vitest run
      - name: Build (Cloudflare Worker)
        run: npx vite build
      - name: Keep the built Worker for the deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: worker
          path: .output
          include-hidden-files: true
          retention-days: 7

  deploy-staging:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://cms-core-staging.mcotesjames.workers.dev
    # One staging deploy at a time, in push order; never cancelled halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: .output
      - name: Note the database restore point (D1 Time Travel)
        run: npx wrangler d1 time-travel info DB
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy the Worker
        run: npx wrangler deploy --config .output/server/wrangler.json
